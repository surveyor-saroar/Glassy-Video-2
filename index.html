<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassy Sidebar V3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mirror-tint: rgba(255, 255, 255, 0.025);
      --mirror-border: rgba(255, 255, 255, 0.28);
      --mirror-sheen-top: rgba(255, 255, 255, 0.22);
      --mirror-sheen-mid: rgba(255, 255, 255, 0.04);
      --mirror-pill-hover: rgba(255, 255, 255, 0.08);
      --mirror-pill-active: rgba(255, 255, 255, 0.14);
      --text-float-shadow: 0 1px 10px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100%;
      background: transparent !important;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    /* Ultra-clear mirror-like glass sidebar with subtle diagonal sheen & specular rim */
    .mirror-sidebar {
      position: relative;
      background:
        linear-gradient(
          128deg,
          var(--mirror-sheen-top) 0%,
          rgba(255, 255, 255, 0.07) 18%,
          var(--mirror-tint) 38%,
          var(--mirror-sheen-mid) 62%,
          rgba(255, 255, 255, 0.015) 100%
        );
      backdrop-filter: blur(6px) saturate(125%) brightness(1.06);
      -webkit-backdrop-filter: blur(6px) saturate(125%) brightness(1.06);
      border: 1px solid var(--mirror-border);
      border-radius: 24px;
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.22),
        inset 1px 1px 0 rgba(255, 255, 255, 0.42),
        inset -1px -1px 0 rgba(255, 255, 255, 0.14),
        inset 0 0 18px rgba(255, 255, 255, 0.04);
      transition: width 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Subtle diagonal mirror reflection streak inside the glass pane */
    .mirror-sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(
        112deg,
        transparent 10%,
        rgba(255, 255, 255, 0.09) 24%,
        rgba(255, 255, 255, 0.02) 34%,
        transparent 46%,
        rgba(255, 255, 255, 0.05) 74%,
        transparent 86%
      );
    }

    .floating-text {
      color: #ffffff;
      text-shadow: var(--text-float-shadow);
    }

    .floating-muted {
      color: rgba(255, 255, 255, 0.86);
      text-shadow: var(--text-float-shadow);
    }

    .floating-section {
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
    }

    .mirror-profile-slot {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.025) 60%,
        rgba(255, 255, 255, 0.05) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .mirror-avatar-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        0 4px 12px rgba(0, 0, 0, 0.18);
    }

    .mirror-nav-item {
      position: relative;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: var(--text-float-shadow);
      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.18s ease;
    }

    .mirror-nav-item:hover {
      background: var(--mirror-pill-hover);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26);
    }

    .mirror-nav-item.is-active {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.06) 100%
      );
      border-color: rgba(255, 255, 255, 0.34);
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        0 6px 16px rgba(0, 0, 0, 0.16);
    }

    .mirror-toggle-btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: transform 0.22s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .mirror-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.55);
      transform: scale(1.06);
    }

    .mirror-notif-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.36);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <!-- Left-aligned clear mirror-glass sidebar over transparent background -->
  <div class="min-h-screen w-full p-4 sm:p-6 flex items-center justify-start">
    <aside id="mirrorSidebar" class="mirror-sidebar w-[274px] p-4 select-none z-10" aria-label="CODEXR Sidebar">

      <!-- Expand / Collapse Edge Toggle -->
      <button
        id="collapseToggleBtn"
        type="button"
        aria-label="Toggle Sidebar"
        title="Expand / Collapse"
        class="mirror-toggle-btn absolute -right-3.5 top-14 w-7 h-7 rounded-full text-white flex items-center justify-center cursor-pointer z-20"
      >
        <svg id="chevronIcon" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Traffic Light Dots -->
      <div class="relative z-10 flex items-center gap-2 px-1.5 pt-0.5 pb-3">
        <span class="w-3 h-3 rounded-full bg-[#ff5f56] shadow-[0_0_6px_rgba(255,95,86,0.5)]"></span>
        <span class="w-3 h-3 rounded-full bg-[#ffbd2e] shadow-[0_0_6px_rgba(255,189,46,0.5)]"></span>
        <span class="w-3 h-3 rounded-full bg-[#27c93f] shadow-[0_0_6px_rgba(39,201,63,0.5)]"></span>
      </div>

      <!-- Brand Header: CODEXR / CXR -->
      <div class="relative z-10 px-1.5 pb-3 border-b border-white/20 flex items-center justify-between">
        <div id="brandFull" class="flex items-center">
          <span class="floating-text font-extrabold tracking-[0.14em] text-2xl">
            CODEXR
          </span>
        </div>
        <div id="brandCompact" class="hidden w-full justify-center py-0.5">
          <span class="floating-text font-bold tracking-wider text-xs">
            CXR
          </span>
        </div>
      </div>

      <!-- Profile Card: S / softysta.com / Super Admin -->
      <div id="profileBlock" class="mirror-profile-slot relative z-10 mt-3 mb-3 p-2.5 rounded-2xl flex items-center justify-between gap-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="mirror-avatar-badge w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-lg floating-text shrink-0">
            S
          </div>
          <div class="collapsible-meta min-w-0">
            <div class="floating-text font-semibold text-sm truncate">softysta.com</div>
            <div class="floating-muted text-[11px] truncate">Super Admin</div>
          </div>
        </div>
        <svg class="collapsible-meta w-4 h-4 text-white/85 shrink-0" style="filter: drop-shadow(0 1px 6px rgba(0,0,0,0.5));" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </div>

      <!-- MENU Heading -->
      <div class="collapsible-meta relative z-10 px-2 pt-0.5 pb-1.5">
        <span class="floating-section text-[10px] font-semibold tracking-[0.16em] uppercase">
          MENU
        </span>
      </div>

      <!-- Navigation List -->
      <nav id="navContainer" class="relative z-10 space-y-1"></nav>

      <!-- Log Out Footer -->
      <div class="relative z-10 mt-6 pt-3 border-t border-white/20">
        <button
          id="logoutItem"
          type="button"
          title="Log Out"
          class="mirror-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer"
        >
          <svg class="w-5 h-5 shrink-0 text-white" style="filter: drop-shadow(0 1px 6px rgba(0,0,0,0.55));" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v9m6.364-5.364a9 9 0 11-12.728 0" />
          </svg>
          <span class="collapsible-label text-sm font-medium truncate">Log Out</span>
        </button>
      </div>

    </aside>
  </div>

  <script>
    const ITEMS = [
      { id: "home", label: "Home" },
      { id: "post", label: "Post" },
      { id: "messages", label: "Messages" },
      { id: "friends", label: "Friends" },
      { id: "notifications", label: "Notifications", badge: "?" },
      { id: "group", label: "Group" },
      { id: "pages", label: "Pages" },
      { id: "games", label: "Games" },
      { id: "setting", label: "Setting" }
    ];

    function getIconSvg(id) {
      const shadowStyle = `style="filter: drop-shadow(0 1px 6px rgba(0,0,0,0.55));"`;
      switch (id) {
        case "home":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>`;
        case "post":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`;
        case "messages":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`;
        case "friends":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`;
        case "notifications":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>`;
        case "group":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
        case "pages":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2"/></svg>`;
        case "games":
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>`;
        case "setting":
        default:
          return `<svg class="w-5 h-5 shrink-0 text-white" ${shadowStyle} fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`;
      }
    }

    let activeId = "home";
    let collapsed = false;

    const sidebarEl = document.getElementById("mirrorSidebar");
    const navContainer = document.getElementById("navContainer");
    const toggleBtn = document.getElementById("collapseToggleBtn");
    const chevronIcon = document.getElementById("chevronIcon");
    const brandFull = document.getElementById("brandFull");
    const brandCompact = document.getElementById("brandCompact");
    const profileBlock = document.getElementById("profileBlock");
    const logoutItem = document.getElementById("logoutItem");

    function renderNav() {
      navContainer.innerHTML = "";
      ITEMS.forEach((item) => {
        const isActive = item.id === activeId;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.title = item.label;
        btn.className = `mirror-nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left cursor-pointer ${
          isActive ? "is-active font-semibold" : "font-medium"
        } ${collapsed ? "justify-center px-2" : ""}`;

        const badge = item.badge && !collapsed
          ? `<span class="mirror-notif-pill ml-auto w-5 h-5 rounded-full text-white text-[11px] font-bold flex items-center justify-center">${item.badge}</span>`
          : "";

        btn.innerHTML = `
          ${getIconSvg(item.id)}
          <span class="${collapsed ? "hidden" : ""} text-sm truncate">${item.label}</span>
          ${badge}
        `;

        btn.addEventListener("click", () => {
          activeId = item.id;
          renderNav();
        });

        navContainer.appendChild(btn);
      });
    }

    function setCollapsed(nextCollapsed) {
      collapsed = nextCollapsed;
      sidebarEl.style.width = collapsed ? "76px" : "274px";
      chevronIcon.style.transform = collapsed ? "rotate(180deg)" : "rotate(0deg)";

      brandFull.classList.toggle("hidden", collapsed);
      brandCompact.classList.toggle("hidden", !collapsed);
      brandCompact.classList.toggle("flex", collapsed);

      document.querySelectorAll(".collapsible-meta, .collapsible-label").forEach((el) => {
        el.classList.toggle("hidden", collapsed);
      });

      profileBlock.classList.toggle("justify-center", collapsed);
      profileBlock.classList.toggle("p-2", collapsed);
      logoutItem.classList.toggle("justify-center", collapsed);
      logoutItem.classList.toggle("px-2", collapsed);

      renderNav();
    }

    toggleBtn.addEventListener("click", () => {
      setCollapsed(!collapsed);
    });

    logoutItem.addEventListener("click", () => {
      activeId = "home";
      renderNav();
    });

    renderNav();
  </script>
</body>
</html>
